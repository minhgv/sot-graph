[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sot-graph"
version = "0.3.0"
description = "Verified, self-healing Source-of-Truth knowledge graph for AI coding agents."
readme = "README.md"
authors = [{ name = "Minh Giap", email = "minhgv@users.noreply.github.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
[project.optional-dependencies]
mcp = ["mcp>=1.3,<2"]
analytics = ["networkx>=3.0", "scipy>=1.10"]
watch = ["watchfiles>=0.21"]
vector = ["sqlite-vec>=0.1.6"]
tokens = ["tiktoken>=0.7"]
scip = ["protobuf>=4.21"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "hypothesis>=6.0.0",
    "tree-sitter>=0.25,<0.30",
    "tree-sitter-go>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-kotlin>=0.7",
    "tree-sitter-swift>=0.7",
    "tree-sitter-php>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-c-sharp>=0.23",
    "networkx>=3.0",
    "scipy>=1.10",
    "watchfiles>=0.21",
    "sqlite-vec>=0.1.6",
    "tiktoken>=0.7",
]
"tree-sitter" = [
    "tree-sitter>=0.25,<0.30",
    "tree-sitter-go>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-kotlin>=0.7",
    "tree-sitter-swift>=0.7",
    "tree-sitter-php>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-c-sharp>=0.23",
]
all = [
    "tree-sitter>=0.25,<0.30",
    "tree-sitter-go>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-kotlin>=0.7",
    "tree-sitter-swift>=0.7",
    "tree-sitter-php>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-c-sharp>=0.23",
    "mcp>=1.3,<2",
    "networkx>=3.0",
    "scipy>=1.10",
    "watchfiles>=0.21",
    "sqlite-vec>=0.1.6",
    "tiktoken>=0.7",
    "protobuf>=4.21",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "hypothesis>=6.0.0",
]

[project.scripts]
sot = "sot_graph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sot_graph = [
    "templates/*",
    "adapters/*.md",
    "adapters/*.ts",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", ".sot", "scripts", "build", "dist", "node_modules", "tests/fixtures"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
