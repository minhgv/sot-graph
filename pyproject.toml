[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sot-graph"
dynamic = ["version"]
description = "Verified, self-healing Source-of-Truth knowledge graph for AI coding agents."
readme = "README.md"
authors = [{ name = "Minh Giap", email = "minhgv@users.noreply.github.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "tomli>=1.1; python_version < '3.11'",
]
[project.urls]
Homepage = "https://github.com/minhgv/sot-graph"
Repository = "https://github.com/minhgv/sot-graph"
Issues = "https://github.com/minhgv/sot-graph/issues"
Changelog = "https://github.com/minhgv/sot-graph/releases"
[project.optional-dependencies]
mcp = ["mcp>=1.3,<2"]
analytics = ["networkx>=3.0", "scipy>=1.10"]
watch = ["watchfiles>=0.21"]
vector = ["sqlite-vec>=0.1.6"]
tokens = ["tiktoken>=0.7"]
scip = ["protobuf>=4.21"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "hypothesis>=6.0.0",
    "ruff>=0.14,<0.15",
    "pyright>=1.1.406,<1.2",
    "tree-sitter>=0.25,<0.30",
    "tree-sitter-c>=0.23",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-dart>=0.1.0",
    "tree-sitter-elixir>=0.3.0",
    "tree-sitter-go>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-julia>=0.23.0",
    "tree-sitter-kotlin>=0.7",
    "tree-sitter-lua>=0.5.0",
    "tree-sitter-swift>=0.7",
    "tree-sitter-php>=0.23",
    "tree-sitter-scala>=0.26.0",
    "tree-sitter-sql>=0.3.0",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-c-sharp>=0.23",
    "tree-sitter-zig>=1.1.0",
    "networkx>=3.0",
    "scipy>=1.10",
    "watchfiles>=0.21",
    "sqlite-vec>=0.1.6",
    "tiktoken>=0.7",
]
"tree-sitter" = [
    "tree-sitter>=0.25,<0.30",
    "tree-sitter-c>=0.23",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-dart>=0.1.0",
    "tree-sitter-elixir>=0.3.0",
    "tree-sitter-go>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-julia>=0.23.0",
    "tree-sitter-kotlin>=0.7",
    "tree-sitter-lua>=0.5.0",
    "tree-sitter-swift>=0.7",
    "tree-sitter-php>=0.23",
    "tree-sitter-scala>=0.26.0",
    "tree-sitter-sql>=0.3.0",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-c-sharp>=0.23",
    "tree-sitter-zig>=1.1.0",
]
all = [
    "tree-sitter>=0.25,<0.30",
    "tree-sitter-c>=0.23",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-dart>=0.1.0",
    "tree-sitter-elixir>=0.3.0",
    "tree-sitter-go>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-julia>=0.23.0",
    "tree-sitter-kotlin>=0.7",
    "tree-sitter-lua>=0.5.0",
    "tree-sitter-swift>=0.7",
    "tree-sitter-php>=0.23",
    "tree-sitter-scala>=0.26.0",
    "tree-sitter-sql>=0.3.0",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-c-sharp>=0.23",
    "tree-sitter-zig>=1.1.0",
    "mcp>=1.3,<2",
    "scipy>=1.10",
    "watchfiles>=0.21",
    "sqlite-vec>=0.1.6",
    "tiktoken>=0.7",
    "protobuf>=4.21",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "hypothesis>=6.0.0",
    "ruff>=0.14,<0.15",
    "pyright>=1.1.406,<1.2",
]

[project.scripts]
sot = "sot_graph.cli:main"

[tool.setuptools.dynamic]
# __version__ is a plain string literal in __init__.py, so setuptools
# reads it statically (no build-time import of the package).
version = { attr = "sot_graph.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sot_graph = [
    "templates/*",
    "adapters/*.md",
    "adapters/*.ts",
    "export/*.js",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", ".sot", "scripts", "build", "dist", "node_modules", "tests/fixtures"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.pyright]
exclude = ["src/sot_graph/_vendor"]
