name: debug-windows

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: debug-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interrupt-trace:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync --all-extras --dev
      - name: pytest with full interrupt trace
        shell: pwsh
        run: |
          $env:PYTHONFAULTHANDLER = '1'
          uv run pytest tests/ --full-trace -q --basetemp="$env:RUNNER_TEMP\dbgtmp"
        continue-on-error: true
