name: diff-impact

# Dogfood: run the SOT-Graph CI-native blast-radius bot on our own PRs,
# via the reusable composite action in .github/actions/diff-impact/.
# Other repositories: copy this workflow or consume the action directly
# (see docs/CI_INTEGRATION.md).

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: 'Git revision to diff against (default: previous commit)'
        required: false
        default: 'HEAD~1'

permissions:
  contents: read
  pull-requests: write

jobs:
  diff-impact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history so the PR merge base is local)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve diff target
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # SG-101: a single revision R means `git diff R~1 R` (the commit
            # that CREATED the base), never base...HEAD. Resolve BOTH PR
            # endpoints and pass an explicit merge-base range instead
            # (git diff A...B; the extractor passes ranges through natively).
            echo "SOT_DIFF_TARGET=${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
          else
            # Non-PR events keep the historical fallback: a single revision,
            # which the engine expands to <rev>~1..<rev>.
            echo "SOT_DIFF_TARGET=${{ inputs.base || 'HEAD~1' }}" >> "$GITHUB_ENV"
          fi

      - name: SOT-Graph Diff Impact
        uses: ./.github/actions/diff-impact
        with:
          target: ${{ env.SOT_DIFF_TARGET }}
          format: github
